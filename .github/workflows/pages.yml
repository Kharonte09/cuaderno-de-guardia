name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancela el que ya esté en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Comprobar que nav.json es válido
        run: node -e "JSON.parse(require('fs').readFileSync('contenido/nav.json','utf8'))"

      - name: Comprobar que todas las rutas del menú existen
        run: |
          node -e "
          const fs = require('fs');
          const nav = JSON.parse(fs.readFileSync('contenido/nav.json','utf8'));
          const rutas = new Set();
          for (const area of nav.areas) {
            if (area.inicio) rutas.add(area.inicio);
            for (const grupo of area.grupos || []) {
              for (const pagina of grupo.paginas || []) rutas.add(pagina.ruta);
            }
          }
          const faltan = [...rutas].filter(r => !fs.existsSync('contenido/' + r + '.md'));
          if (faltan.length) {
            console.error('Faltan ficheros:', faltan.join(', '));
            process.exit(1);
          }
          console.log('Todas las rutas del menu existen (' + rutas.size + ').');
          "

      - name: Avisar de páginas que no salen en el menú
        run: |
          node -e "
          const fs = require('fs');
          const nav = JSON.parse(fs.readFileSync('contenido/nav.json','utf8'));
          const rutas = new Set();
          for (const area of nav.areas) {
            if (area.inicio) rutas.add(area.inicio);
            for (const grupo of area.grupos || []) {
              for (const pagina of grupo.paginas || []) rutas.add(pagina.ruta);
            }
          }
          const recorrer = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap(
            (e) => e.isDirectory() ? recorrer(dir + '/' + e.name)
                 : e.name.endsWith('.md') ? [dir + '/' + e.name] : []
          );
          const sueltas = recorrer('contenido')
            .map(f => f.replace(/^contenido\//, '').replace(/\.md\$/, ''))
            .filter(r => !rutas.has(r));
          if (sueltas.length) console.log('::warning::Sin enlazar en el menu: ' + sueltas.join(', '));
          else console.log('Todas las paginas estan enlazadas.');
          "

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
